# A broker of a fault test's own (B-105): brought up for one test through kontainer, paused or stopped by it,
# and removed after it. The shared fixture (docker-compose.yml) is never touched by a fault on linuxX64.
#
# Not the shared file with an override: that one has a fixed container name and fixed ports, which is exactly
# what two brokers on one box cannot share. The settings are the same, and the same image.
#
# TWO LISTENERS. The one the tests use advertises the host port kontainer chose; the broker's own traffic
# and the image's tools use INTERNAL, which is reachable inside the container. With one listener, anything
# inside would be sent to a host port that does not exist there.
services:
  broker:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:${KONTAINER_PORT_BROKER_9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:${KONTAINER_PORT_BROKER_9092},INTERNAL://127.0.0.1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # OFF, as on the shared broker: a topic nobody created must not appear by being written to.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
