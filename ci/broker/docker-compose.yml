# The broker every acceptance assertion in this project is made against.
#
# A real broker rather than a fake, and the reason is in docs/services/test-broker.md: a fake encodes
# this project's understanding of Kafka and then checks that understanding against itself, which is
# blind to the one class of defect a client most needs to catch.
#
# The tag is pinned. A moving tag silently re-points the environment between runs, and then every
# number taken against it describes an unknown broker.

services:
  broker:
    image: apache/kafka:4.3.1
    container_name: kafkakn-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      # Required, with no default. Without it the broker aborts in StorageTool before it ever
      # listens - and `docker compose up --wait` still reports the container Healthy.
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # OFF, deliberately. With auto-creation on, a test that produces to a topic nobody created
      # succeeds and proves nothing; the scenario "an unknown topic is an error, not a silence"
      # cannot even be written.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
