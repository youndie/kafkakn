# Exact versions, never ranges. The deliverable of this project is a library other people pin, and
# a range makes "which version did that" unanswerable. What actually resolved is read off the
# dependency tree in the run, because a catalogue states an intent and a build states a fact.

# Kotlin and coroutines are NOT here: they are in the portfolio's shared `wip` catalogue, because a
# klib this project publishes carries metadata that a build on another compiler version refuses.
# What stays is what is this project's own and nobody else's business.

[versions]
# The number is here AND in settings.gradle.kts, and it cannot be in one place: `pluginManagement`
# is evaluated before any catalogue exists, so the settings plugin's version has to be a literal
# there. The two are kept equal by hand, which is the cost the portfolio pays for the arrangement.
sborka = "0.4.0.86"
# The JVM arm delegates to this, and it is the same release as the broker below - one variable fewer
# in the differential suite.
kafka-clients = "4.3.1"
# Not a Gradle dependency: the C library the native arm links. Pinned here so one file names the
# whole environment; ci/librdkafka reads it.
librdkafka = "2.13.0"
# A moving tag would silently re-point the environment between runs.
kafka-image = "apache/kafka:4.3.1"

[libraries]
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients" }

[plugins]
# The module half of the conventions: the coordinate, the toolchain, explicit API, warnings as
# errors, the formatter and the publication.
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
