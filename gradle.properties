# The coordinate, in ONE place. Gradle applies these to every project, so a module cannot quietly
# publish under a different group by forgetting to set one - which is how six modules in a sibling
# project once shipped under the wrong coordinate.
group=io.github.youndie
version=0.1.0-SNAPSHOT

# Kotlin/Native needs more than the default on the build box.
org.gradle.jvmargs=-Xmx3g
