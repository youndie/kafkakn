# The coordinate, in ONE place. Gradle applies these to every project, so a module cannot quietly
# publish under a different group by forgetting to set one - which is how six modules in a sibling
# project once shipped under the wrong coordinate.
# The group is the project's own, not the account's: artefacts land under
# `io/github/youndie/kafkakn/`, which is one directory a publishing token can be scoped to and a
# namespace Maven Central can be asked for later. `io.github.youndie` would scatter this project's
# artefacts among every other one of the account's.
sborka.group=io.github.youndie.kafkakn
version=0.1.0-SNAPSHOT

# What the published POM says about this repository. It was wrong before the conventions arrived:
# the POM written by hand claimed Apache-2.0 while LICENSE is MIT, and the snapshots already on the
# server carry that. `sborka.licence` defaults to MIT, so it is not set here - the default is the
# answer, and a value typed beside a correct default is a value that drifts from it.
sborka.repository=youndie/kafkakn
sborka.description=A Kafka producer for Kotlin Multiplatform: librdkafka on native, the official client on the JVM
sborka.inceptionYear=2026

# The jvm artefact keeps the bytecode target it has. The convention's default floor is 17, which is
# a WIDER promise than this repository has ever made or measured - and a floor is the oldest Java a
# consumer may be on, so lowering it is a decision about who may use the library, not a formatting
# detail. Taken deliberately or not at all.
sborka.jvmFloor=21

# Kotlin/Native needs more than the default on the build box.
org.gradle.jvmargs=-Xmx3g
