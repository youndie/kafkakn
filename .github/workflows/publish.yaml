# Numbered versions to reposilite, and the whole of the artefact side even when it cannot upload.
#
# EVERY RUN PUBLISHES A VERSION OF ITS OWN (B-75): the head from gradle.properties, the run number on
# the tail, the way sborka numbers its own. Six builds had gone out as one `0.1.0-SNAPSHOT`, and a
# consumer could name the one it needed only by its timestamp. A published version is never written
# again (the preflight refuses it), and a tag `v<version>` is pushed at the commit it was built from.
#
# The job always builds the C bundle and publishes to a Maven repository on disk, listing what it
# produced coordinate by coordinate. Only the last step needs credentials. That split is deliberate:
# a publish workflow that can only be exercised by someone holding the secrets is a workflow nobody
# can check, and its first real run is then also its first test.
#
# `-Pkafkakn.noKafkaC` is NOT used here. It drops the cinterop, and the artefact it produces is a
# different one wearing the same coordinate - a measurement aid, never something to publish.

name: publish

# Started by hand only. It used to start on a pushed `v*` tag too, and this workflow now pushes one.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # For the tag at the end, and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The portfolio's one implementation of `<head>.<run number>`. Every script below reads the
      # result through ci/lib/coordinate.sh, and every Gradle call gets it as -PVERSION.
      - id: version
        uses: youndie/sborka/.github/actions/determine-version@main
      - run: echo "KAFKAKN_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The bundle is built in a manylinux2014 container and takes minutes; it changes only when the
      # librdkafka version in the catalogue does, which is what the key is.
      - id: bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/kafkakn
          key: kafkakn-c-bundle-${{ hashFiles('gradle/libs.versions.toml', 'ci/librdkafka/**') }}

      - if: steps.bundle.outputs.cache-hit != 'true'
        run: bash ci/librdkafka/build.sh

      # Everything except the upload. A failure here is about the artefacts, not about credentials.
      - run: bash ci/publish/run.sh

      # EVERY coordinate is asked before ANY of them is written. A KMP module has one per target and
      # a Reposilite route is a string prefix, so a token can legitimately hold the first and none of
      # the rest — measured, 403 on `-jvm`. Whether that ends as a refusal or as a half-uploaded
      # version is otherwise decided by Gradle's task order, which is not a thing to rely on.
      - name: can the token write every coordinate
        if: env.REPOSILITE_USER != ''
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: bash ci/publish/preflight.sh

      # The upload, and the only step that needs anything secret. Skipped rather than failed when
      # the secrets are absent, so the rest of this workflow stays checkable by anyone.
      - name: publish to reposilite
        if: env.REPOSILITE_USER != ''
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: |
          ./gradlew --no-daemon --console=plain "-PVERSION=$KAFKAKN_VERSION" :kafkakn-core:publishAllPublicationsToWipRepository \
              :kafkakn-schema-registry:publishAllPublicationsToWipRepository
          echo "published io.github.youndie.kafkakn:kafkakn-core{,-jvm,-linuxx64}:$KAFKAKN_VERSION"
          echo "published io.github.youndie.kafkakn:kafkakn-schema-registry{,-jvm,-linuxx64}:$KAFKAKN_VERSION"

      # An upload that returned 2xx is not a publication. This is the statement worth making: a
      # separate build, knowing a coordinate and a URL, compiling against every variant with the
      # group purged from its cache.
      - name: resolve what was just published
        if: env.REPOSILITE_USER != ''
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
        run: bash ci/publish/verify-published.sh

      # The number leads back to the commit (B-75). Only after the version resolved from the network:
      # a tag on a publish that did not land names a version nobody can use. A tag that already exists
      # fails this step, which is right, since the preflight has refused that version before it.
      - name: tag the commit with the version
        if: env.REPOSILITE_USER != ''
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
        run: |
          git tag "v$KAFKAKN_VERSION" "$GITHUB_SHA"
          git push origin "v$KAFKAKN_VERSION"
          echo "v$KAFKAKN_VERSION -> $GITHUB_SHA"

      - name: say so when it did not upload
        if: env.REPOSILITE_USER == ''
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
        run: |
          echo "::warning::REPOSILITE_USER / REPOSILITE_SECRET are not set on this repository."
          echo "::warning::The artefacts were built and checked; nothing was uploaded."
