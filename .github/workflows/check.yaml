# The documentation gate. `docs/` lives in this repository, so `make check` needs no arguments.
#
# It has been watched failing, which is the only reason to believe it can: B-14 pushed a backlog
# number already taken on main and a feature pointing at an endpoint that does not exist, and both
# runs are linked from docs/backlog/B-14-ci-workflow.md. A gate whose whole history is green is a
# gate nobody has tested.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - with docs-bootstrap's checks at the
  # version this `uses:` line pins; the Makefile reads the same line for a local run. Around it, the
  # two checks that depend on the event: on a pull request, backlog item numbers against the base
  # branch, BEFORE the gate; on a push to main, `status: draft` as an error.
  #
  # The numbers check stays a backstop here, not the guard. Every branch in this repository commits
  # the regenerated `backlog.md`, so two branches that each add an item conflict in that one file and
  # the conflict is what stops them - and a pull request that cannot be merged gets no
  # `pull_request` run at all. It stays because it says which branch took the number; B-14 measured
  # the difference (`B-09: here B-09-duplicate-demo.md, on origin/main already B-09-accounting.md`
  # against the gate's `duplicate ids: B-09`).
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.8

      # THE FORMATTER IS A GATE OR IT IS NOTHING. `sborka.lint` pins ktlint and the portfolio's rule
      # set, and a rule set that only runs where somebody remembers to run it is a rule set that
      # drifts out of the code. It found two things that were not formatting on the day it arrived:
      # a KDoc orphaned by a declaration inserted under it, and three catches that swallowed
      # CancellationException - one of which had already filed a `runTest` timeout as a producer
      # failure.
      #
      # Only the formatter. Compiling the native arm needs the C bundle and the suite needs a broker;
      # those run in the `suite` workflow.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - run: ./gradlew --no-daemon --console=plain ktlintCheck

  # On a schedule, apart from the gate. The list is at zero and every path outside this repository
  # is an address (SPEC 4.1) - inside a dependency's artefact or at a commit of another repository -
  # which nothing elsewhere can move. So the report blocks: the Makefile sets `ANCHORS_ARGS=--check`,
  # and `make check` in the job above fails on a path of this repository's own that resolves to
  # nothing, in the pull request that broke it. This job runs the same report on the default branch
  # once a week.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository documents itself, so there is nothing else to clone: the Makefile's
      # `REPOS = .` makes its own subdirectories the trees. A documentation repository covering
      # several services would clone them shallowly here instead, and treat a repository it cannot
      # read as a warning rather than a failure - an anchor that could not be checked is not an
      # anchor that rotted.
      - uses: youndie/docs-bootstrap@v0.3.8
        with:
          target: report
